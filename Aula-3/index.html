<!DOCTYPE html>
<!-- saved from url=(0090)https://ava.unifacear.edu.br/pluginfile.php/2107465/mod_resource/content/1/formulario.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Cliente</title>

    <!-- Estilo - CSS Interno-->
    <style>
        /* Reset dos elementos */
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }

        /* formatação de estilo para o corpo do site */
        body {
            font-family: Arial, Helvetica, sans-serif; 
            background-color: bisque;
            color: #333;   
        }
        /* Estilo do cabeçalho da página */
        header {
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;    
        }

        header p {
            font-size: 14px;
            margin-top: 5px;
            color: #ccc;
            border-radius: 12px;
        }



        /* container principal, que vai envolver o formulario*/
        main {
            max-width: 700px;
            margin: 30px auto;
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        main h2{
            margin-bottom: 20px;
            color:#333;
            border-bottom: 2px solid #080101;
            padding-bottom: 10px;
        }

        .campo {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /*configura varios tipos de uma vez*/

        .campo input,
        .campo select,
        .campo textarea{
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        
        /*Agrupamento de campo lado a lado*/
        /*Cidade,Estado,Cep*/
        
        .linha{
            display: flex;
            gap: 15px; 
        }

        .linha .campo{
            flex: 1;
        }

        /*Area para upload da foto*/
        
        .upload-foto{
            margin-bottom: 20px;
            text-align: center;
            border: 2px dashed #7c7a7a;
            border-radius: 12px;
            padding: 20px;
        }

        /*Configurando o botão*/

        .btn-enviar, .button{
            background-color: #e54bcb;
            color:#fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16;
            margin-top: 20px;
            text-align: center;
        }

        .btn-enviar:hover{
            background-color: #b398ab;
        }

        /*Estilo do nosso rodapé*/

        footer{
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            text-align: center;
        }


    </style>
</head>

<body>
    <!--construção do cabeçalho do site-->    
    <header>
        <h1>Sistema de Gestão de Clientes</h1>
        <p>Módulo de Cadastro de Pessoas</p>
    </header>

    <!--Conteúdo principal do site-->
    <main>
        <h2>Cadastro de Cliente</h2>
        <a href="../index.html"><button class="button">Voltar</button></a>
        <br>
        <br>
        <!-- iniciando o formulário -->
         <form action="https://ava.unifacear.edu.br/pluginfile.php/2107465/mod_resource/content/1/formulario.html#" method="POST" enctype="multipart/form-data">
            <div class="upload-foto">
                <label for="foto"><strong>Foto do Cliente</strong></label>
                <br><br>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <!-- dados pessoais -->
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required="">
            </div>
            
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required="">
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <select id="genero" name="genero">
                    <option value="">Selecione</option>
                    <option value="feminino">Feminino</option>
                    <option value="masculino"> Masculino</option>
                    <option value="nao-informado">Não desejo informar</option>
                </select>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required="">
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" type="tel" name="telefone" placeholder="(00) 00000-0000" required="">
            </div>

            <!-- Endereço -->
            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">
            </div>
            
            <div class="linha">
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Cidade">
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">UF</option>
                        <option value="PR">PR</option>
                        <option value="SC">SC</option>
                        <option value="RS">RS</option>
                        <option value="RJ">RJ</option>
                        <!-- Outros estados aqui....-->                        
                    </select>    
                </div>
                
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000">
                </div>
            </div>

            <!--OBSERVAÇOES-->
            <div class="campo">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" rows="4" placeholder="Informações adicionais sobre o cliente">                </textarea>
            </div>
            
            <!--Botao de envio-->
            <input type="submit" value="Cadastrar Cliente" class="btn-enviar">
         </form>
    </main>

    <!--Rodapé do nosso site-->
    <footer>
        <p>© 2026 Sistema de Gestão de Clientes - Todos os direitos reservados</p>
        <p>Desenvolvido para fins didáticos</p>
    </footer>

</body></html>
