<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com tabelas</title>
</head>
<body>
    <!--Criando tabelas-->
    <table border="16">Flores 
    <a href="index.html"><button class="button">Inicio</button></a>
        <th>Nome</th>
        <th>Cor</th>
        <th>Tamanho</th>
        <th>Foto</th>
        
        <!-- Linha do primeiro Registro -->
        <tr>
            <td>Orquidea</td>
            <td>Amarela</td>
            <td>Pequena</td>
            <td>
                <a href="https://www.floresonline.com.br/orquidea-phalaenopsis-plantada-branca-01066">
                <img src="IMG/Orquideas.jpg" alt="Orquidea" width="30%">
                </a>
            </td>
        </tr>
        <!-- Linha do segundo Registro -->
        <tr>
            <td>Rosa</td>
            <td>Vermelha</td>
            <td>Média</td>
            <td>
                <a href="https://www.floresonline.com.br/buque-12-rosas-vermelhas-01067">
                <img src="IMG/Rosas.jpg" alt="Rosa" width="30%">
                </a>
            </td>
        </tr>
        <!-- Linha do terceiro Registro -->
        <tr>
            <td>Violeta</td>
            <td>Roxa</td>
            <td>Pequena</td>
            <td>
                <a href="https://www.floresonline.com.br/encontro-de-violetas">
                    <img src="IMG/Violetas.jpg" alt="Violeta" width="30%">
                </a>
            </td>
        </tr>
        <!-- Linha do quarto Registro -->
        <tr>
            <td>Girassol</td>
            <td>Amarela</td>
            <td>Grande</td>
            <td>
                <a href="https://www.floresonline.com.br/seja-luz">
                    <img src="IMG/Girassol.jpg" alt="Girassol" width="30%">
                </a>
            </td>
        </tr>
    </table>

</body>
</html>
