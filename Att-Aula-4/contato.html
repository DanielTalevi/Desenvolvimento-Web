<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<style>
          /* Reset dos Elementos */
        *{
            margin:0;
            page:0;
            box-sizing:border-box;
        }
        
        /*Formataçao de Estilo para o corpo do site*/

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(176, 252, 53);
            color:#0400ff;
        }

        /*Estilo do Cabeçalho da Pagina*/

        header{
            background-color: #977400;
            color: #008d6a;
            text-align: center;
            padding: 20px;
        }

        h1{
            font-size: 24px;
        }

        header p{
            font-size: 14px;
            margin-top: 5px;
            color: #65019e;
        }

        /*container principal, que vai envolver o formulario*/
        main{
            max-width: 700px;
            margin: 30px auto;
            background-color: #d6a70c;
            padding: 25px auto;
            border: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0,1);
        }

        .campo{
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .botao-redirecionar {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        border: none;
        cursor: pointer;
        }
  
        .botao-redirecionar:hover {
        background-color: #0056b3;
        }

        .centralizar {
        text-align: center;
        }

</Style>
<body>

    <main>
        <h1 class="centralizar">Aluguel de Jogos</h1>
        <!-- Iniciando o Formulario -->
         <form action="#" method="post" enctype="multipart/form-data">
            
            <!-- criando uma div-->
            <br><br>
            <h3 class="centralizar">Fale com nosco</h3>
            
            <br>
            
            <!-- Inserindo dados pessoais -->
            
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>
             
            <br>

            <!-- Inserindo E-mail -->

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Exemplo@email.com" required>
            </div>

            <br>

            <!-- Inserindo Telefone -->


            <div class="campo">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto da mensagem" required>
            </div>

            <br>

            <!--OBSERVAÇOEs-->

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" rows="5" placeholder="Digite sua mensagem">
                </textarea>
            </div>



            <!-- Botao de Envio -->
                <br>
            <input type="submit" value="Enviar mensagem" class="btn-enviar">
        </form>

        <br>
<div class="centralizar">
            <a href="index.html" class="botao-redirecionar">inicio</a>
</div>
        <br>
        <br>

    </main>
    <footer>
        <p> &copy; 2026 Sistema de Gestao de Clientes, Todos os Direitos Reservados</p>
        <p>Desenvolvido para fins didaticos</p>
    </footer>
</body>
</html>
